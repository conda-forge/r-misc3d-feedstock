{% set version = "0.9-2" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-misc3d
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/misc3d_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/misc3d/misc3d_{{ version }}.tar.gz
  sha256: fabd1b0348def8244a627664206cfa610a84fa34c6e21da73a6c13d547229b99

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
  run:
    - r-base

test:
  commands:
    - $R -e "library('misc3d')"           # [not win]
    - "\"%R%\" -e \"library('misc3d')\""  # [win]

about:
  home: https://CRAN.R-project.org/package=misc3d
  license: GPL-2.0-or-later
  summary: A collection of miscellaneous 3d plots, including isosurfaces.
  license_family: GPL
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
